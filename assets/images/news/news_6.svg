<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="news_6_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f7971e"/>
        <stop offset="100%" stop-color="#ffd200"/>
      </linearGradient>
      <linearGradient id="news_6_floor" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
      </linearGradient>
      <linearGradient id="news_6_wall" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
      <linearGradient id="news_6_glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.10)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.20)"/>
      </linearGradient>
      <radialGradient id="news_6_spot" cx="50%" cy="20%" r="60%">
        <stop offset="0%" stop-color="rgba(255,240,200,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
      </radialGradient>
      <linearGradient id="news_6_accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0"/>
        <stop offset="50%" stop-color="#7b2ff7" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
      </linearGradient>
      <filter id="news_6_blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
      <filter id="news_6_shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="black" flood-opacity="0.35"/>
      </filter>
      <filter id="news_6_glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#news_6_bg)"/>

    <!-- 顶部聚光（暖光氛围） -->
    <rect width="400" height="180" fill="url(#news_6_spot)"/>

    <!-- 装饰光斑 -->
    <circle cx="60" cy="50" r="42" fill="white" opacity="0.06"/>
    <circle cx="350" cy="240" r="55" fill="white" opacity="0.05"/>
    <circle cx="340" cy="60" r="22" fill="white" opacity="0.08"/>

    <!-- 场景插画 -->
    
      <!-- 趋势分析背景 -->
      <rect x="40" y="60" width="320" height="150" fill="rgba(255,255,255,0.10)"/>
      <polygon points="40,210 360,210 380,280 20,280" fill="rgba(0,0,0,0.18)"/>

      <!-- 图表背景 -->
      <rect x="80" y="80" width="240" height="120" rx="4" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.5)" stroke-width="1.6" filter="url(#news_6_shadow)"/>
      <!-- 坐标轴 -->
      <line x1="100" y1="184" x2="308" y2="184" stroke="rgba(255,255,255,0.6)" stroke-width="1.4"/>
      <line x1="100" y1="92" x2="100" y2="184" stroke="rgba(255,255,255,0.6)" stroke-width="1.4"/>
      <!-- 柱状图 -->
      <rect x="116" y="150" width="22" height="34" rx="1" fill="rgba(0,212,255,0.6)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <rect x="150" y="136" width="22" height="48" rx="1" fill="rgba(0,255,128,0.6)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <rect x="184" y="122" width="22" height="62" rx="1" fill="rgba(255,200,80,0.6)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <rect x="218" y="108" width="22" height="76" rx="1" fill="rgba(255,120,180,0.6)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <rect x="252" y="96" width="22" height="88" rx="1" fill="rgba(180,140,255,0.6)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <!-- 趋势线 -->
      <path d="M 127 144 L 161 130 L 195 116 L 229 102 L 263 90" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linejoin="round"/>
      <!-- 数据点 -->
      <circle cx="127" cy="144" r="3" fill="white"/>
      <circle cx="161" cy="130" r="3" fill="white"/>
      <circle cx="195" cy="116" r="3" fill="white"/>
      <circle cx="229" cy="102" r="3" fill="white"/>
      <circle cx="263" cy="90" r="3" fill="rgba(0,255,128,0.9)" filter="url(#news_6_glow)"/>
    

    <!-- 底部渐变遮罩（增强文字可读性，配合 HTML overlay） -->
    <rect y="170" width="400" height="130" fill="url(#news_6_floor)"/>

    <!-- 分类标签（玻璃拟态） -->
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1" filter="url(#news_6_blur)"/>
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="30" y="36" font-size="12" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">行业资讯</text>
  </svg>