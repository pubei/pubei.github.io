<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="grad_6" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ee0979"/>
        <stop offset="100%" stop-color="#ff6a00"/>
      </linearGradient>
      <linearGradient id="grad_6_overlay" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="black" stop-opacity="0"/>
        <stop offset="100%" stop-color="black" stop-opacity="0.4"/>
      </linearGradient>
      <filter id="grad_6_shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="black" flood-opacity="0.3"/>
      </filter>
    </defs>
    
    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#grad_6)"/>
    
    <!-- 装饰性圆圈 -->
    <circle cx="40" cy="263" r="33" fill="white" opacity="0.15"/>
      <circle cx="82" cy="189" r="26" fill="white" opacity="0.07"/>
      <circle cx="296" cy="219" r="28" fill="white" opacity="0.12"/>
      <circle cx="176" cy="60" r="25" fill="white" opacity="0.15"/>
    
    <!-- 装饰性线条 -->
    <line x1="141" y1="132" x2="218" y2="133" stroke="white" stroke-width="1" opacity="0.05"/>
      <line x1="132" y1="25" x2="246" y2="16" stroke="white" stroke-width="1" opacity="0.10"/>
      <line x1="81" y1="84" x2="185" y2="59" stroke="white" stroke-width="1" opacity="0.10"/>
    
    <!-- 底部渐变遮罩 -->
    <rect width="400" height="300" fill="url(#grad_6_overlay)"/>
    
    <!-- 分类标签 -->
    <rect x="20" y="20" rx="12" ry="12" width="80" height="28" fill="white" opacity="0.2"/>
    <text x="32" y="40" font-size="13" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">行业资讯</text>
    
    <!-- 图标 -->
    <text x="200" y="135" text-anchor="middle" font-size="56" filter="url(#grad_6_shadow)">🎯</text>
    
    <!-- 主标题 -->
    <text x="200" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="white" font-family="'Noto Sans SC', sans-serif" letter-spacing="1">2026年装修流行趋势：这五种…</text>
    
    <!-- 副标题 -->
    <text x="200" y="240" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.75)" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">行业资讯 · 前沿洞察</text>
    
    <!-- 底部品牌信息 -->
    <line x1="150" y1="270" x2="250" y2="270" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="200" y="288" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans SC', sans-serif">浦北装修设计 · 专业品质 · 匠心铸就</text>
  </svg>