<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="news_20260728256_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff9a9e"/>
        <stop offset="100%" stop-color="#fad0c4"/>
      </linearGradient>
      <linearGradient id="news_20260728256_floor" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
      </linearGradient>
      <linearGradient id="news_20260728256_wall" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
      <linearGradient id="news_20260728256_glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.10)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.20)"/>
      </linearGradient>
      <radialGradient id="news_20260728256_spot" cx="50%" cy="20%" r="60%">
        <stop offset="0%" stop-color="rgba(255,240,200,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
      </radialGradient>
      <linearGradient id="news_20260728256_accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      </linearGradient>
      <filter id="news_20260728256_blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
      <filter id="news_20260728256_shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="black" flood-opacity="0.35"/>
      </filter>
      <filter id="news_20260728256_glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#news_20260728256_bg)"/>

    <!-- 顶部聚光（暖光氛围） -->
    <rect width="400" height="180" fill="url(#news_20260728256_spot)"/>

    <!-- 装饰光斑 -->
    <circle cx="60" cy="50" r="42" fill="white" opacity="0.06"/>
    <circle cx="350" cy="240" r="55" fill="white" opacity="0.05"/>
    <circle cx="340" cy="60" r="22" fill="white" opacity="0.08"/>

    <!-- 场景插画 -->
    
      <!-- 儿童房背景 -->
