      <path d="M 110 80 l 1.5 4 l 4 0.8 l -3 3 l 0.8 4 l -3.3 -1.6 l -3.3 1.6 l 0.8 -4 l -3 -3 l 4 -0.8 z" fill="rgba(255,120,180,0.8)" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/>
