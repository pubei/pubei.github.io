<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="grad_5" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#373b44"/>
        <stop offset="100%" stop-color="#4286f4"/>
      </linearGradient>
      <linearGradient id="grad_5_overlay" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="black" stop-opacity="0"/>
        <stop offset="100%" stop-color="black" stop-opacity="0.4"/>
      </linearGradient>
      <filter id="grad_5_shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="black" flood-opacity="0.3"/>
      </filter>
    </defs>
    
    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#grad_5)"/>
    
    <!-- 装饰性圆圈 -->
    <circle cx="42" cy="79" r="26" fill="white" opacity="0.08"/>
      <circle cx="131" cy="190" r="26" fill="white" opacity="0.11"/>
      <circle cx="20" cy="56" r="17" fill="white" opacity="0.06"/>
      <circle cx="104" cy="163" r="27" fill="white" opacity="0.14"/>
      <circle cx="108" cy="201" r="48" fill="white" opacity="0.12"/>
      <circle cx="102" cy="208" r="26" fill="white" opacity="0.12"/>
    
    <!-- 装饰性线条 -->
    <line x1="18" y1="207" x2="120" y2="237" stroke="white" stroke-width="1" opacity="0.09"/>
      <line x1="34" y1="89" x2="88" y2="96" stroke="white" stroke-width="1" opacity="0.06"/>
    
    <!-- 底部渐变遮罩 -->
    <rect width="400" height="300" fill="url(#grad_5_overlay)"/>
    
    <!-- 分类标签 -->
    <rect x="20" y="20" rx="12" ry="12" width="80" height="28" fill="white" opacity="0.2"/>
    <text x="32" y="40" font-size="13" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">公司动态</text>
    
    <!-- 图标 -->
    <text x="200" y="135" text-anchor="middle" font-size="56" filter="url(#grad_5_shadow)">⭐</text>
    
    <!-- 主标题 -->
    <text x="200" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="white" font-family="'Noto Sans SC', sans-serif" letter-spacing="1">设计团队参加高端室内设计培训，…</text>
    
    <!-- 副标题 -->
    <text x="200" y="240" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.75)" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">公司动态 · 实时更新</text>
    
    <!-- 底部品牌信息 -->
    <line x1="150" y1="270" x2="250" y2="270" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="200" y="288" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans SC', sans-serif">浦北装修设计 · 专业品质 · 匠心铸就</text>
  </svg>