<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="news_3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ee0979"/>
        <stop offset="100%" stop-color="#ff6a00"/>
      </linearGradient>
      <linearGradient id="news_3_floor" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
      </linearGradient>
      <linearGradient id="news_3_wall" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
      <linearGradient id="news_3_glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.10)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.20)"/>
      </linearGradient>
      <radialGradient id="news_3_spot" cx="50%" cy="20%" r="60%">
        <stop offset="0%" stop-color="rgba(255,240,200,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
      </radialGradient>
      <linearGradient id="news_3_accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      </linearGradient>
      <filter id="news_3_blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
      <filter id="news_3_shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="black" flood-opacity="0.35"/>
      </filter>
      <filter id="news_3_glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#news_3_bg)"/>

    <!-- 顶部聚光（暖光氛围） -->
    <rect width="400" height="180" fill="url(#news_3_spot)"/>

    <!-- 装饰光斑 -->
    <circle cx="60" cy="50" r="42" fill="white" opacity="0.06"/>
    <circle cx="350" cy="240" r="55" fill="white" opacity="0.05"/>
    <circle cx="340" cy="60" r="22" fill="white" opacity="0.08"/>

    <!-- 场景插画 -->
    
      <!-- 避坑指南背景 -->
      <rect x="40" y="60" width="320" height="150" fill="rgba(255,255,255,0.10)"/>
      <polygon points="40,210 360,210 380,280 20,280" fill="rgba(0,0,0,0.18)"/>

      <!-- 清单卡片 -->
      <rect x="60" y="70" width="160" height="160" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" filter="url(#news_3_shadow)"/>
      <rect x="70" y="90" width="14" height="14" rx="2" fill="rgba(0,255,128,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
      <path d="M 73 97 l 3 3 l 5 -6" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="92" y="94" width="110" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
      <rect x="92" y="100" width="90" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="70" y="114" width="14" height="14" rx="2" fill="rgba(0,255,128,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
      <path d="M 73 121 l 3 3 l 5 -6" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="92" y="118" width="110" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
      <rect x="92" y="124" width="90" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="70" y="138" width="14" height="14" rx="2" fill="rgba(0,255,128,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
      <path d="M 73 145 l 3 3 l 5 -6" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="92" y="142" width="110" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
      <rect x="92" y="148" width="90" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="70" y="162" width="14" height="14" rx="2" fill="rgba(0,255,128,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
      <path d="M 73 169 l 3 3 l 5 -6" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="92" y="166" width="110" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
      <rect x="92" y="172" width="90" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="70" y="186" width="14" height="14" rx="2" fill="rgba(0,255,128,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
      <path d="M 73 193 l 3 3 l 5 -6" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="92" y="190" width="110" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
      <rect x="92" y="196" width="90" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
    
      <!-- 警示三角 -->
      <path d="M 250 160 L 300 160 L 275 110 Z" fill="rgba(255,200,80,0.65)" stroke="rgba(255,255,255,0.85)" stroke-width="2" filter="url(#news_3_shadow)"/>
      <!-- 感叹号 -->
      <rect x="273" y="124" width="4" height="22" rx="1" fill="white"/>
      <circle cx="275" cy="152" r="2.5" fill="white"/>
    

    <!-- 底部渐变遮罩（增强文字可读性，配合 HTML overlay） -->
    <rect y="170" width="400" height="130" fill="url(#news_3_floor)"/>

    <!-- 分类标签（玻璃拟态） -->
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1" filter="url(#news_3_blur)"/>
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="30" y="36" font-size="12" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">行业资讯</text>
  </svg>