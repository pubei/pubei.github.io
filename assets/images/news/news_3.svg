<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="grad_3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#43e97b"/>
        <stop offset="100%" stop-color="#38f9d7"/>
      </linearGradient>
      <linearGradient id="grad_3_overlay" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="black" stop-opacity="0"/>
        <stop offset="100%" stop-color="black" stop-opacity="0.4"/>
      </linearGradient>
      <filter id="grad_3_shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="black" flood-opacity="0.3"/>
      </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#grad_3)"/>

    <!-- 装饰性圆圈 -->
    <circle cx="193" cy="140" r="28" fill="white" opacity="0.08"/>
      <circle cx="54" cy="106" r="38" fill="white" opacity="0.14"/>
      <circle cx="95" cy="65" r="30" fill="white" opacity="0.12"/>
      <circle cx="37" cy="141" r="16" fill="white" opacity="0.07"/>
      <circle cx="294" cy="257" r="38" fill="white" opacity="0.05"/>

    <!-- 装饰性线条 -->
    <line x1="194" y1="259" x2="289" y2="286" stroke="white" stroke-width="1" opacity="0.08"/>
      <line x1="139" y1="72" x2="243" y2="82" stroke="white" stroke-width="1" opacity="0.12"/>
      <line x1="126" y1="242" x2="194" y2="252" stroke="white" stroke-width="1" opacity="0.10"/>
      <line x1="150" y1="180" x2="220" y2="178" stroke="white" stroke-width="1" opacity="0.08"/>

    <!-- 房屋轮廓装饰 -->
    <g opacity="0.10" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round">
      <path d="M 330 265 L 330 205 L 370 175 L 410 205 L 410 265 Z"/>
      <rect x="345" y="225" width="18" height="40"/>
      <rect x="378" y="215" width="22" height="22"/>
    </g>
    <g opacity="0.08" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round">
      <path d="M -10 285 L -10 245 L 25 220 L 60 245 L 60 285 Z"/>
      <rect x="5" y="255" width="15" height="30"/>
    </g>

    <!-- 底部渐变遮罩 -->
    <rect width="400" height="300" fill="url(#grad_3_overlay)"/>

    <!-- 分类标签 -->
    <rect x="20" y="20" rx="12" ry="12" width="80" height="28" fill="white" opacity="0.2"/>
    <text x="32" y="40" font-size="13" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">装修设计</text>

    <!-- 图标（装修主题） -->
    <text x="200" y="135" text-anchor="middle" font-size="56" filter="url(#grad_3_shadow)" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🎨</text>

    <!-- 主标题 -->
    <text x="200" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="white" font-family="'Noto Sans SC', sans-serif" letter-spacing="1">装修避坑指南：新房装修必看的十…</text>

    <!-- 副标题 -->
    <text x="200" y="240" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.75)" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">装修设计 · 匠心品质</text>

    <!-- 底部品牌信息 -->
    <line x1="150" y1="270" x2="250" y2="270" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="200" y="288" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans SC', sans-serif">浦北装修设计 · 专业品质 · 匠心铸就</text>
  </svg>