<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="news_20260731993_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fa709a"/>
        <stop offset="100%" stop-color="#fee140"/>
      </linearGradient>
      <linearGradient id="news_20260731993_floor" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
      </linearGradient>
      <linearGradient id="news_20260731993_wall" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
      <linearGradient id="news_20260731993_glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.10)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.20)"/>
      </linearGradient>
      <radialGradient id="news_20260731993_spot" cx="50%" cy="20%" r="60%">
        <stop offset="0%" stop-color="rgba(255,240,200,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
      </radialGradient>
      <linearGradient id="news_20260731993_accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      </linearGradient>
      <filter id="news_20260731993_blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
      <filter id="news_20260731993_shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="black" flood-opacity="0.35"/>
      </filter>
      <filter id="news_20260731993_glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#news_20260731993_bg)"/>

    <!-- 顶部聚光（暖光氛围） -->
    <rect width="400" height="180" fill="url(#news_20260731993_spot)"/>

    <!-- 装饰光斑 -->
    <circle cx="60" cy="50" r="42" fill="white" opacity="0.06"/>
    <circle cx="350" cy="240" r="55" fill="white" opacity="0.05"/>
    <circle cx="340" cy="60" r="22" fill="white" opacity="0.08"/>

    <!-- 场景插画 -->
    
      <!-- 荣誉墙背景 -->
      <rect x="40" y="60" width="320" height="150" fill="rgba(255,255,255,0.10)"/>
      <polygon points="40,210 360,210 380,280 20,280" fill="rgba(0,0,0,0.18)"/>

      <!-- 证书背景 -->
      <rect x="80" y="80" width="140" height="110" rx="4" fill="rgba(255,255,255,0.20)" stroke="rgba(255,240,200,0.85)" stroke-width="2" filter="url(#news_20260731993_shadow)"/>
      <!-- 金色边框 -->
      <rect x="86" y="86" width="128" height="98" rx="2" fill="none" stroke="rgba(255,200,80,0.7)" stroke-width="1.4"/>
      <!-- 顶部装饰 -->
      <path d="M 134 94 l 4 8 l 8 1 l -6 6 l 2 8 l -8 -4 l -8 4 l 2 -8 l -6 -6 l 8 -1 z" fill="rgba(255,220,120,0.85)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
      <!-- 标题条 -->
      <rect x="110" y="116" width="80" height="6" rx="2" fill="rgba(255,200,80,0.7)"/>
      <!-- 内容线条 -->
      <line x1="104" y1="138" x2="196" y2="138" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
      <line x1="110" y1="150" x2="190" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="110" y1="160" x2="180" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <!-- 认证印章 -->
      <circle cx="192" cy="164" r="14" fill="rgba(255,80,80,0.55)" stroke="rgba(255,200,200,0.85)" stroke-width="1.6"/>
      <path d="M 184 164 l 5 5 l 8 -10" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      <!-- 丝带 -->
      <path d="M 110 190 L 102 208 L 110 202 L 118 208 Z" fill="rgba(255,120,80,0.55)" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
    
      <!-- 奖杯杯身 -->
      <path d="M 226 90 L 274 90 L 270 126 q -4 14 -20 14 q -16 0 -20 -14 Z" fill="rgba(255,220,120,0.65)" stroke="rgba(255,255,255,0.85)" stroke-width="2" filter="url(#news_20260731993_shadow)"/>
      <!-- 奖杯把手 -->
      <path d="M 226 96 q -14 2 -12 16 q 2 8 12 6" fill="none" stroke="rgba(255,220,120,0.65)" stroke-width="2"/>
      <path d="M 274 96 q 14 2 12 16 q -2 8 -12 6" fill="none" stroke="rgba(255,220,120,0.65)" stroke-width="2"/>
      <!-- 奖杯底座 -->
      <rect x="242" y="140" width="16" height="14" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.6)" stroke-width="1.4"/>
      <rect x="232" y="154" width="36" height="6" rx="2" fill="rgba(255,255,255,0.45)" stroke="rgba(255,255,255,0.65)" stroke-width="1.4"/>
      <!-- 星星 -->
      <path d="M 250 104 l 3 7 l 7 1 l -5 5 l 1 7 l -6 -3 l -6 3 l 1 -7 l -5 -5 l 7 -1 z" fill="rgba(255,255,255,0.85)" stroke="rgba(255,200,80,0.7)" stroke-width="1"/>
    
      <!-- 奖章装饰 -->
      <circle cx="320" cy="170" r="20" fill="rgba(255,200,80,0.50)" stroke="rgba(255,255,255,0.75)" stroke-width="1.8"/>
      <circle cx="320" cy="170" r="12" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
      <path d="M 308 188 L 304 218 L 320 210 L 336 218 L 332 188 Z" fill="rgba(255,120,80,0.50)" stroke="rgba(255,255,255,0.6)" stroke-width="1.4"/>
      <text x="320" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="sans-serif">A+</text>

    <!-- 底部渐变遮罩（增强文字可读性，配合 HTML overlay） -->
    <rect y="170" width="400" height="130" fill="url(#news_20260731993_floor)"/>

    <!-- 分类标签（玻璃拟态） -->
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1" filter="url(#news_20260731993_blur)"/>
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="30" y="36" font-size="12" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">公司动态</text>
  </svg>