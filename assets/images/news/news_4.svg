<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="grad_4" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#614385"/>
        <stop offset="100%" stop-color="#516395"/>
      </linearGradient>
      <linearGradient id="grad_4_overlay" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="black" stop-opacity="0"/>
        <stop offset="100%" stop-color="black" stop-opacity="0.4"/>
      </linearGradient>
      <filter id="grad_4_shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="black" flood-opacity="0.3"/>
      </filter>
    </defs>
    
    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#grad_4)"/>
    
    <!-- 装饰性圆圈 -->
    <circle cx="302" cy="151" r="15" fill="white" opacity="0.08"/>
      <circle cx="156" cy="229" r="20" fill="white" opacity="0.09"/>
      <circle cx="73" cy="124" r="48" fill="white" opacity="0.13"/>
    
    <!-- 装饰性线条 -->
    <line x1="175" y1="3" x2="268" y2="-12" stroke="white" stroke-width="1" opacity="0.08"/>
      <line x1="139" y1="291" x2="186" y2="305" stroke="white" stroke-width="1" opacity="0.10"/>
    
    <!-- 底部渐变遮罩 -->
    <rect width="400" height="300" fill="url(#grad_4_overlay)"/>
    
    <!-- 分类标签 -->
    <rect x="20" y="20" rx="12" ry="12" width="80" height="28" fill="white" opacity="0.2"/>
    <text x="32" y="40" font-size="13" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">行业资讯</text>
    
    <!-- 图标 -->
    <text x="200" y="135" text-anchor="middle" font-size="56" filter="url(#grad_4_shadow)">🔮</text>
    
    <!-- 主标题 -->
    <text x="200" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="white" font-family="'Noto Sans SC', sans-serif" letter-spacing="1">环保装修材料新升级，打造绿色健…</text>
    
    <!-- 副标题 -->
    <text x="200" y="240" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.75)" font-family="'Noto Sans SC', sans-serif" letter-spacing="2">行业资讯 · 前沿洞察</text>
    
    <!-- 底部品牌信息 -->
    <line x1="150" y1="270" x2="250" y2="270" stroke="white" stroke-width="1" opacity="0.3"/>
    <text x="200" y="288" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans SC', sans-serif">浦北装修设计 · 专业品质 · 匠心铸就</text>
  </svg>