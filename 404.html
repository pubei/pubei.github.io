<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到 | 浦北装修设计</title>
  <meta name="description" content="抱歉，您访问的页面不存在。请返回首页或使用导航查找所需内容。">
  <meta name="robots" content="noindex, follow">

  <meta property="og:url" content="https://pboo.top/404.html">
  <meta property="og:title" content="404 - 页面未找到">
  <meta property="og:description" content="抱歉，您访问的页面不存在">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="浦北装修设计">
  <link rel="stylesheet" href="assets/css/style.css?v=47">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --c-primary: #00d4ff;
      --c-secondary: #7b2ff7;
      --c-accent: #00ff80;
      --c-bg: #0a0e17;
      --c-text: #ffffff;
      --c-text-sec: rgba(255,255,255,0.72);
      --c-text-muted: rgba(255,255,255,0.42);
      --c-card: rgba(255,255,255,0.04);
      --c-border: rgba(255,255,255,0.08);
      --radius: 16px;
      --radius-lg: 24px;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* ===== 背景极光层 ===== */
    .aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: orbDrift 20s ease-in-out infinite;
    }
    .aurora-orb.o1 { width: 480px; height: 480px; top: -10%; left: -8%; background: radial-gradient(circle, rgba(0,212,255,0.45), transparent 70%); animation-delay: 0s; }
    .aurora-orb.o2 { width: 420px; height: 420px; top: 40%; right: -10%; background: radial-gradient(circle, rgba(123,47,247,0.40), transparent 70%); animation-delay: -7s; }
    .aurora-orb.o3 { width: 360px; height: 360px; bottom: -10%; left: 30%; background: radial-gradient(circle, rgba(0,255,128,0.20), transparent 70%); animation-delay: -14s; }
    @keyframes orbDrift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* 网格背景 */
    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
    }

    /* 浮动粒子层 */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: particleRise 14s linear infinite;
    }
    .particle:nth-child(odd) { background: var(--c-primary); }
    .particle:nth-child(3n) { background: var(--c-secondary); }
    .particle:nth-child(5n) { background: var(--c-accent); }
    @keyframes particleRise {
      0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
      10% { opacity: 0.7; transform: translateY(85vh) translateX(10px) scale(1); }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(60px) scale(0.5); opacity: 0; }
    }

    /* ===== 主容器 ===== */
    .error-wrap {
      max-width: 780px;
      width: 100%;
      position: relative;
      z-index: 2;
      text-align: center;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== 工具图标区 ===== */
    .tools-zone {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 12px;
      height: 96px;
    }
    .tool-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: toolFloat 3s ease-in-out infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .tool-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--c-primary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tool-icon:nth-child(1) { animation-delay: 0s; }
    .tool-icon:nth-child(2) { animation-delay: 0.3s; }
    .tool-icon:nth-child(3) { animation-delay: 0.6s; }
    .tool-icon:nth-child(4) { animation-delay: 0.9s; }
    .tool-icon:nth-child(5) { animation-delay: 1.2s; }
    .tool-icon:nth-child(odd) svg { stroke: var(--c-primary); }
    .tool-icon:nth-child(even) svg { stroke: var(--c-secondary); }
    .tool-icon:nth-child(5n) svg { stroke: var(--c-accent); }
    .tool-icon:hover {
      transform: translateY(-6px) scale(1.08);
      box-shadow: 0 8px 24px rgba(0,212,255,0.2);
      border-color: rgba(0,212,255,0.3);
    }
    @keyframes toolFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* 旋转光环 */
    .glow-ring {
      position: absolute;
      width: 220px;
      height: 220px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(0,212,255,0.18) 90deg, transparent 180deg, rgba(123,47,247,0.18) 270deg, transparent 360deg);
      animation: spin 12s linear infinite;
      z-index: -1;
      filter: blur(24px);
    }
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ===== 错误标签 ===== */
    .error-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--c-primary);
      padding: 7px 18px;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 18px;
      letter-spacing: 0.6px;
    }
    .error-tag .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c-primary);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(0,212,255,0.5); }
      50% { opacity: 0.7; transform: scale(1.25); box-shadow: 0 0 0 10px rgba(0,212,255,0); }
    }

    /* ===== 404 数字 3D 效果 ===== */
    .error-code-wrap {
      position: relative;
      perspective: 800px;
      margin-bottom: 12px;
    }
    .error-code {
      font-size: clamp(96px, 22vw, 180px);
      font-weight: 800;
      line-height: 0.9;
      background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 50%, #00ff80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -8px;
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      animation: codeFloat 6s ease-in-out infinite;
    }
    @keyframes codeFloat {
      0%, 100% { transform: rotateX(0) rotateY(0) translateY(0); }
      25% { transform: rotateX(2deg) rotateY(-3deg) translateY(-4px); }
      50% { transform: rotateX(0) rotateY(0) translateY(-8px); }
      75% { transform: rotateX(-2deg) rotateY(3deg) translateY(-4px); }
    }
    /* 光晕副本 */
    .error-code::after {
      content: '404';
      position: absolute;
      top: 0; left: 0;
      right: 0;
      background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 50%, #00ff80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(32px);
      opacity: 0.5;
      z-index: -1;
      letter-spacing: -8px;
    }

    /* ===== 标题和描述 ===== */
    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 700;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-desc {
      font-size: 1.02rem;
      color: var(--c-text-sec);
      line-height: 1.8;
      max-width: 480px;
      margin: 0 auto 36px;
    }

    /* ===== 搜索框 ===== */
    .search-bar {
      display: flex;
      gap: 8px;
      max-width: 460px;
      margin: 0 auto 32px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px;
      border-radius: 100px;
      border: 1px solid var(--c-border);
      transition: all 0.35s ease;
    }
    .search-bar:focus-within {
      border-color: rgba(0,212,255,0.45);
      box-shadow: 0 0 48px rgba(0,212,255,0.18), 0 0 0 1px rgba(0,212,255,0.1) inset;
      background: rgba(255,255,255,0.06);
    }
    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 0.95rem;
      padding: 12px 20px;
      font-family: inherit;
    }
    .search-bar input::placeholder { color: var(--c-text-muted); }
    .search-btn {
      background: linear-gradient(135deg, var(--c-primary), #0099cc);
      border: none;
      color: #0a0e17;
      padding: 12px 28px;
      border-radius: 100px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: inherit;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .search-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(0,212,255,0.45);
    }
    .search-btn svg {
      width: 16px;
      height: 16px;
      stroke: #0a0e17;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== 快速导航 ===== */
    .quick-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      max-width: 580px;
      margin: 0 auto 32px;
    }
    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 12px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--c-text-sec);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    /* 流光扫过 */
    .nav-link::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.10), transparent);
      transition: left 0.7s ease;
    }
    .nav-link:hover::before { left: 100%; }
    /* 顶部边框流光 */
    .nav-link::after {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--c-primary), transparent);
      transition: width 0.4s ease;
    }
    .nav-link:hover {
      transform: translateY(-6px);
      border-color: rgba(0,212,255,0.32);
      background: rgba(0,212,255,0.06);
      box-shadow: 0 15px 40px rgba(0,212,255,0.12);
      color: var(--c-text);
    }
    .nav-link:hover::after { width: 80%; }
    .nav-link:hover .nav-icon { transform: scale(1.15) rotate(-4deg); }
    .nav-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s ease;
    }
    .nav-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--c-primary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-text {
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* ===== 按钮组 ===== */
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      border: none;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn-home {
      background: linear-gradient(135deg, var(--c-primary), var(--c-secondary));
      color: white;
      box-shadow: 0 8px 30px rgba(0,212,255,0.28);
    }
    .btn-home svg { stroke: white; fill: none; }
    .btn-home:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 15px 50px rgba(0,212,255,0.45);
    }
    .btn-back {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--c-border);
      color: var(--c-text);
    }
    .btn-back svg { stroke: var(--c-text); fill: none; }
    .btn-back:hover {
      transform: translateY(-4px);
      border-color: rgba(0,212,255,0.32);
      background: rgba(0,212,255,0.06);
    }

    /* ===== 自动跳转 ===== */
    .auto-redirect {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--c-border);
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.85rem;
      color: var(--c-text-muted);
    }
    .auto-redirect svg {
      width: 14px;
      height: 14px;
      stroke: var(--c-text-muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .countdown {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: rgba(0,212,255,0.15);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 50%;
      font-weight: 700;
      color: var(--c-primary);
      font-size: 0.9rem;
    }
    .redirect-cancel {
      color: var(--c-text-muted);
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.3s ease;
    }
    .redirect-cancel:hover { color: var(--c-primary); }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .tools-zone { height: 76px; gap: 8px; }
      .tool-icon { width: 38px; height: 38px; }
      .tool-icon svg { width: 18px; height: 18px; }
      .glow-ring { width: 160px; height: 160px; }
      .search-bar { flex-direction: column; border-radius: var(--radius); padding: 8px; }
      .search-btn { width: 100%; border-radius: var(--radius); padding: 14px; justify-content: center; }
      .btn-group { flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto 32px; }
      .btn { width: 100%; justify-content: center; }
      .quick-nav { grid-template-columns: repeat(2, 1fr); }
      .error-code { letter-spacing: -4px; }
    }
  </style>
</head>
<body>
  <div class="aurora">
    <div class="aurora-orb o1"></div>
    <div class="aurora-orb o2"></div>
    <div class="aurora-orb o3"></div>
  </div>
  <div class="grid-bg"></div>
  <div class="particles" id="particles"></div>

  <div class="error-wrap">
    <div class="tools-zone">
      <div class="glow-ring"></div>
      <div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg></div>
      <div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      <div class="tool-icon"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2a6 6 0 0 0 9 5l2 1v2a4 4 0 0 1-3 3.87V22H4v-4.13A4 4 0 0 1 1 14v-2l2-1a6 6 0 0 0 9-5z"/></svg></div>
      <div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 12l3-3m-3 3l3 3M21 12l-3-3m3 3l-3 3M9 6v12M15 6v12"/></svg></div>
      <div class="tool-icon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.3.3.5.7.5 1.1V17h7v-1.2c0-.4.2-.8.5-1.1A7 7 0 0 0 12 2z"/></svg></div>
    </div>

    <div class="error-tag">
      <span class="dot"></span>
      <span>ERROR · 页面未找到</span>
    </div>

    <div class="error-code-wrap">
      <h1 class="error-code">404</h1>
    </div>

    <h2 class="error-title">这个页面还在装修中</h2>

    <p class="error-desc">
      您访问的页面可能已被移动、重命名或暂时下线。<br>
      就像装修一样，我们正在不断优化空间布局。
    </p>

    <form class="search-bar" onsubmit="handleSearch(event)">
      <input type="text" id="searchInput" placeholder="搜索您想找的内容...">
      <button type="submit" class="search-btn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>搜索</span>
      </button>
    </form>

    <div class="quick-nav">
      <a href="/" class="nav-link">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
        <span class="nav-text">首页</span>
      </a>
      <a href="services.html" class="nav-link">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75zM3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg></span>
        <span class="nav-text">服务</span>
      </a>
      <a href="projects.html" class="nav-link">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></span>
        <span class="nav-text">案例</span>
      </a>
      <a href="news.html" class="nav-link">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></span>
        <span class="nav-text">新闻</span>
      </a>
      <a href="contact.html" class="nav-link">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg></span>
        <span class="nav-text">预约</span>
      </a>
    </div>

    <div class="btn-group">
      <a href="/" class="btn btn-home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>返回首页</span>
      </a>
      <a href="javascript:history.back()" class="btn btn-back">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>返回上一页</span>
      </a>
    </div>

    <div class="auto-redirect" id="autoRedirect">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span><span class="countdown" id="countdown">10</span> 秒后自动返回首页</span>
      <span class="redirect-cancel" onclick="cancelRedirect()">取消</span>
    </div>
  </div>

  <script>
    // 创建浮动粒子
    function createParticles() {
      const container = document.getElementById('particles');
      const count = 30;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 3 + Math.random() * 4;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 14 + 's';
        p.style.animationDuration = (10 + Math.random() * 8) + 's';
        container.appendChild(p);
      }
    }

    // 搜索功能
    function handleSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        window.location.href = '/?q=' + encodeURIComponent(query);
      }
    }

    // 倒计时自动跳转
    let countdownTimer = null;
    let redirectTimer = null;

    function startCountdown() {
      let seconds = 10;
      const countdownEl = document.getElementById('countdown');
      countdownTimer = setInterval(() => {
        seconds--;
        if (countdownEl) countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          window.location.href = '/';
        }
      }, 1000);
    }

    function cancelRedirect() {
      if (countdownTimer) clearInterval(countdownTimer);
      const redirectEl = document.getElementById('autoRedirect');
      if (redirectEl) {
        redirectEl.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>已取消自动跳转</span>';
        redirectEl.style.color = 'var(--c-accent)';
      }
    }

    // 页面加载时初始化（脚本在body末尾，DOM已就绪，直接调用）
    createParticles();
    startCountdown();

    // 3D 鼠标视差：404 数字随鼠标轻微转动
    const errorCode = document.querySelector('.error-code');
    if (errorCode) {
      document.addEventListener('mousemove', function(e) {
        const x = (e.clientX / window.innerWidth - 0.5) * 6;
        const y = (e.clientY / window.innerHeight - 0.5) * 6;
        errorCode.style.transform = `rotateY(${x}deg) rotateX(${-y}deg) translateY(${Math.sin(Date.now()/1000) * -4}px)`;
      });
    }
  </script>
</body>
