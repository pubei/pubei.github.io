<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到 | 浦北装修设计</title>
  <meta name="description" content="抱歉，您访问的页面不存在。请返回首页或使用导航查找所需内容。">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://pboo.top/404.html">
  <meta property="og:url" content="https://pboo.top/404.html">
  <meta property="og:title" content="404 - 页面未找到">
  <meta property="og:description" content="抱歉，您访问的页面不存在">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="浦北装修设计">
  <link rel="stylesheet" href="assets/css/style.css?v=31">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --c-primary: #00d4ff;
      --c-secondary: #7b2ff7;
      --c-accent: #00ff80;
      --c-bg: #0a0e17;
      --c-text: #ffffff;
      --c-text-sec: rgba(255,255,255,0.7);
      --c-text-muted: rgba(255,255,255,0.4);
      --c-card: rgba(255,255,255,0.04);
      --c-border: rgba(255,255,255,0.08);
      --radius: 16px;
      --radius-lg: 24px;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* 背景渐变光晕 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(0,212,255,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(123,47,247,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(0,255,128,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* 网格背景 */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    .error-wrap {
      max-width: 760px;
      width: 100%;
      position: relative;
      z-index: 2;
      text-align: center;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 工具图标动画区 */
    .tools-zone {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
      height: 120px;
    }

    .tool-icon {
      font-size: 56px;
      animation: toolBounce 2s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(0,212,255,0.3));
    }

    .tool-icon:nth-child(1) { animation-delay: 0s; }
    .tool-icon:nth-child(2) { animation-delay: 0.2s; }
    .tool-icon:nth-child(3) { animation-delay: 0.4s; }
    .tool-icon:nth-child(4) { animation-delay: 0.6s; }
    .tool-icon:nth-child(5) { animation-delay: 0.8s; }

    @keyframes toolBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-18px) rotate(-8deg); }
      75% { transform: translateY(-10px) rotate(8deg); }
    }

    /* 旋转光环 */
    .glow-ring {
      position: absolute;
      width: 200px;
      height: 200px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(0,212,255,0.15) 90deg, transparent 180deg, rgba(123,47,247,0.15) 270deg, transparent 360deg);
      animation: spin 8s linear infinite;
      z-index: -1;
      filter: blur(20px);
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* 404数字 */
    .error-code {
      font-size: clamp(100px, 22vw, 200px);
      font-weight: 800;
      line-height: 0.9;
      background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 50%, #00ff80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -8px;
      position: relative;
      margin-bottom: 8px;
    }

    .error-code::after {
      content: '404';
      position: absolute;
      top: 0; left: 0; right: 0;
      background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 50%, #00ff80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(30px);
      opacity: 0.4;
      z-index: -1;
      letter-spacing: -8px;
    }

    .error-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.2);
      color: var(--c-primary);
      padding: 6px 18px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .error-tag .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c-primary);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(0,212,255,0.4); }
      50% { opacity: 0.6; transform: scale(1.2); box-shadow: 0 0 0 8px rgba(0,212,255,0); }
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--c-text-sec);
      line-height: 1.8;
      max-width: 480px;
      margin: 0 auto 40px;
    }

    /* 搜索框 */
    .search-bar {
      display: flex;
      gap: 8px;
      max-width: 460px;
      margin: 0 auto 32px;
      background: var(--c-card);
      backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: 100px;
      border: 1px solid var(--c-border);
      transition: all 0.3s ease;
    }

    .search-bar:focus-within {
      border-color: rgba(0,212,255,0.4);
      box-shadow: 0 0 40px rgba(0,212,255,0.15);
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 0.95rem;
      padding: 12px 20px;
      font-family: inherit;
    }

    .search-bar input::placeholder { color: var(--c-text-muted); }

    .search-btn {
      background: linear-gradient(135deg, var(--c-primary), #0099cc);
      border: none;
      color: #0a0e17;
      padding: 12px 28px;
      border-radius: 100px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .search-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 30px rgba(0,212,255,0.4);
    }

    /* 快速链接 */
    .quick-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      max-width: 560px;
      margin: 0 auto 32px;
    }

    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px 12px;
      background: var(--c-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--c-text-sec);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .nav-link::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.08), transparent);
      transition: left 0.6s ease;
    }

    .nav-link:hover::before { left: 100%; }

    .nav-link:hover {
      transform: translateY(-6px);
      border-color: rgba(0,212,255,0.3);
      background: rgba(0,212,255,0.06);
      box-shadow: 0 15px 40px rgba(0,212,255,0.1);
    }

    .nav-link:hover .nav-icon { transform: scale(1.2); }

    .nav-icon {
      font-size: 28px;
      transition: transform 0.3s ease;
    }

    .nav-text {
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* 按钮组 */
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      border: none;
    }

    .btn-home {
      background: linear-gradient(135deg, var(--c-primary), var(--c-secondary));
      color: white;
      box-shadow: 0 8px 30px rgba(0,212,255,0.25);
    }

    .btn-home:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 15px 50px rgba(0,212,255,0.4);
    }

    .btn-back {
      background: var(--c-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--c-border);
      color: var(--c-text);
    }

    .btn-back:hover {
      transform: translateY(-4px);
      border-color: rgba(0,212,255,0.3);
      background: rgba(0,212,255,0.05);
    }

    /* 倒计时提示 */
    .auto-redirect {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--c-card);
      border: 1px solid var(--c-border);
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.85rem;
      color: var(--c-text-muted);
    }

    .countdown {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: rgba(0,212,255,0.15);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 50%;
      font-weight: 700;
      color: var(--c-primary);
      font-size: 0.9rem;
    }

    .redirect-cancel {
      color: var(--c-text-muted);
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.3s ease;
    }

    .redirect-cancel:hover { color: var(--c-primary); }

    /* 浮动粒子 */
    .particles {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--c-primary);
      border-radius: 50%;
      opacity: 0;
      animation: particleRise 12s linear infinite;
    }

    .particle:nth-child(odd) { background: var(--c-secondary); }
    .particle:nth-child(3n) { background: var(--c-accent); width: 6px; height: 6px; }

    @keyframes particleRise {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-100px) translateX(50px); opacity: 0; }
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .tools-zone { height: 80px; gap: 8px; }
      .tool-icon { font-size: 36px; }
      .glow-ring { width: 140px; height: 140px; }
      .search-bar { flex-direction: column; border-radius: var(--radius); padding: 8px; }
      .search-btn { width: 100%; border-radius: var(--radius); padding: 14px; }
      .btn-group { flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto 32px; }
      .btn { width: 100%; justify-content: center; }
      .quick-nav { grid-template-columns: repeat(2, 1fr); }
      .error-code { letter-spacing: -4px; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="error-wrap">
    <div class="tools-zone">
      <div class="glow-ring"></div>
      <div class="tool-icon">📐</div>
      <div class="tool-icon">🔨</div>
      <div class="tool-icon">🎨</div>
      <div class="tool-icon">🪚</div>
      <div class="tool-icon">💡</div>
    </div>

    <div class="error-tag">
      <span class="dot"></span>
      <span>ERROR · 页面未找到</span>
    </div>

    <h1 class="error-code">404</h1>

    <h2 class="error-title">这个页面还在装修中</h2>

    <p class="error-desc">
      您访问的页面可能已被移动、重命名或暂时下线。<br>
      就像装修一样，我们正在不断优化空间布局。
    </p>

    <form class="search-bar" onsubmit="handleSearch(event)">
      <input type="text" id="searchInput" placeholder="搜索您想找的内容...">
      <button type="submit" class="search-btn">🔍 搜索</button>
    </form>

    <div class="quick-nav">
      <a href="/" class="nav-link">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">首页</span>
      </a>
      <a href="services.html" class="nav-link">
        <span class="nav-icon">🛠️</span>
        <span class="nav-text">服务</span>
      </a>
      <a href="projects.html" class="nav-link">
        <span class="nav-icon">🖼️</span>
        <span class="nav-text">案例</span>
      </a>
      <a href="news.html" class="nav-link">
        <span class="nav-icon">📰</span>
        <span class="nav-text">新闻</span>
      </a>
      <a href="contact.html" class="nav-link">
        <span class="nav-icon">📞</span>
        <span class="nav-text">预约</span>
      </a>
    </div>

    <div class="btn-group">
      <a href="/" class="btn btn-home">
        <span>🏠</span>
        <span>返回首页</span>
      </a>
      <a href="javascript:history.back()" class="btn btn-back">
        <span>←</span>
        <span>返回上一页</span>
      </a>
    </div>

    <div class="auto-redirect" id="autoRedirect">
      <span>⏱️</span>
      <span><span class="countdown" id="countdown">10</span> 秒后自动返回首页</span>
      <span class="redirect-cancel" onclick="cancelRedirect()">取消</span>
    </div>
  </div>

  <script>
    // 创建浮动粒子
    function createParticles() {
      const container = document.getElementById('particles');
      const count = 25;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 12 + 's';
        p.style.animationDuration = (8 + Math.random() * 8) + 's';
        container.appendChild(p);
      }
    }

    // 搜索功能
    function handleSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        window.location.href = '/?q=' + encodeURIComponent(query);
      }
    }

    // 倒计时自动跳转
    let countdownTimer = null;
    let redirectTimer = null;

    function startCountdown() {
      let seconds = 10;
      const countdownEl = document.getElementById('countdown');
      countdownTimer = setInterval(() => {
        seconds--;
        if (countdownEl) countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          window.location.href = '/';
        }
      }, 1000);
    }

    function cancelRedirect() {
      if (countdownTimer) clearInterval(countdownTimer);
      const redirectEl = document.getElementById('autoRedirect');
      if (redirectEl) {
        redirectEl.innerHTML = '<span>✅</span><span>已取消自动跳转</span>';
        redirectEl.style.color = 'var(--c-accent)';
      }
    }
// 页面加载时初始化（脚本在body末尾，DOM已就绪，直接调用）
    createParticles();
    startCountdown();
  </script>
</body>
</html>
