<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="news_20260715_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00d4ff"/>
        <stop offset="100%" stop-color="#0099cc"/>
      </linearGradient>
      <linearGradient id="news_20260715_floor" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
      </linearGradient>
      <linearGradient id="news_20260715_wall" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
      <linearGradient id="news_20260715_glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.10)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.20)"/>
      </linearGradient>
      <radialGradient id="news_20260715_spot" cx="50%" cy="20%" r="60%">
        <stop offset="0%" stop-color="rgba(255,240,200,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
      </radialGradient>
      <linearGradient id="news_20260715_accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ff6b6b" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
      </linearGradient>
      <filter id="news_20260715_blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
      <filter id="news_20260715_shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="black" flood-opacity="0.35"/>
      </filter>
      <filter id="news_20260715_glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#news_20260715_bg)"/>

    <!-- 顶部聚光（暖光氛围） -->
    <rect width="400" height="180" fill="url(#news_20260715_spot)"/>

    <!-- 装饰光斑 -->
    <circle cx="60" cy="50" r="42" fill="white" opacity="0.06"/>
    <circle cx="350" cy="240" r="55" fill="white" opacity="0.05"/>
    <circle cx="340" cy="60" r="22" fill="white" opacity="0.08"/>

    <!-- 场景插画 -->
    
      <!-- 签约场景背景 -->
      <rect x="40" y="60" width="320" height="150" fill="rgba(255,255,255,0.10)"/>
      <polygon points="40,210 360,210 380,280 20,280" fill="rgba(0,0,0,0.18)"/>

      <!-- 桌面 -->
      <rect x="50" y="170" width="300" height="8" rx="2" fill="rgba(255,255,255,0.30)" stroke="rgba(255,255,255,0.5)" stroke-width="1.4" filter="url(#news_20260715_shadow)"/>
      <rect x="56" y="178" width="6" height="36" fill="rgba(255,255,255,0.22)"/>
      <rect x="338" y="178" width="6" height="36" fill="rgba(255,255,255,0.22)"/>

      <!-- 合同文件 -->
      <rect x="80" y="120" width="120" height="60" rx="2" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.7)" stroke-width="1.6" filter="url(#news_20260715_shadow)"/>
      <line x1="90" y1="132" x2="190" y2="132" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
      <line x1="90" y1="140" x2="180" y2="140" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
      <line x1="90" y1="148" x2="184" y2="148" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
      <line x1="90" y1="156" x2="170" y2="156" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>
      <!-- 合同印章 -->
      <circle cx="180" cy="168" r="8" fill="rgba(255,80,80,0.65)" stroke="rgba(255,200,200,0.8)" stroke-width="1.2"/>

      <!-- 笔 -->
      <line x1="210" y1="148" x2="240" y2="148" stroke="rgba(255,255,255,0.8)" stroke-width="2.4"/>
      <path d="M 240 148 L 246 145 L 246 151 Z" fill="rgba(255,255,255,0.9)"/>

      <!-- 房屋钥匙/钥匙扣 -->
      <circle cx="290" cy="135" r="12" fill="none" stroke="rgba(255,200,80,0.85)" stroke-width="2.4" filter="url(#news_20260715_glow)"/>
      <rect x="300" y="132" width="30" height="6" rx="1" fill="rgba(255,200,80,0.85)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
      <rect x="320" y="138" width="4" height="6" fill="rgba(255,200,80,0.85)"/>
      <rect x="326" y="138" width="4" height="6" fill="rgba(255,200,80,0.85)"/>

      <!-- 全屋定制户型图（背景装饰） -->
      <g opacity="0.45">
        <rect x="200" y="80" width="120" height="36" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.4"/>
        <line x1="240" y1="80" x2="240" y2="116" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
        <line x1="280" y1="80" x2="280" y2="116" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
        <text x="260" y="102" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)" font-family="'Noto Sans SC', sans-serif">户型图</text>
      </g>
    

    <!-- 底部渐变遮罩（增强文字可读性，配合 HTML overlay） -->
    <rect y="170" width="400" height="130" fill="url(#news_20260715_floor)"/>

    <!-- 分类标签（玻璃拟态） -->
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1" filter="url(#news_20260715_blur)"/>
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="30" y="36" font-size="12" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">公司动态</text>
  </svg>