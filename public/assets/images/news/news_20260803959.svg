<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <defs>
      <linearGradient id="news_20260803959_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#667eea"/>
        <stop offset="100%" stop-color="#764ba2"/>
      </linearGradient>
      <linearGradient id="news_20260803959_floor" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
      </linearGradient>
      <linearGradient id="news_20260803959_wall" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
      </linearGradient>
      <linearGradient id="news_20260803959_glass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.10)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.20)"/>
      </linearGradient>
      <radialGradient id="news_20260803959_spot" cx="50%" cy="20%" r="60%">
        <stop offset="0%" stop-color="rgba(255,240,200,0.55)"/>
        <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
      </radialGradient>
      <linearGradient id="news_20260803959_accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
      </linearGradient>
      <filter id="news_20260803959_blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
      <filter id="news_20260803959_shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="black" flood-opacity="0.35"/>
      </filter>
      <filter id="news_20260803959_glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="400" height="300" fill="url(#news_20260803959_bg)"/>

    <!-- 顶部聚光（暖光氛围） -->
    <rect width="400" height="180" fill="url(#news_20260803959_spot)"/>

    <!-- 装饰光斑 -->
    <circle cx="60" cy="50" r="42" fill="white" opacity="0.06"/>
    <circle cx="350" cy="240" r="55" fill="white" opacity="0.05"/>
    <circle cx="340" cy="60" r="22" fill="white" opacity="0.08"/>

    <!-- 场景插画 -->
    
      <!-- 房间透视：后墙 + 地板 -->
      <rect x="40" y="60" width="320" height="150" fill="rgba(255,255,255,0.12)"/>
      <polygon points="40,210 360,210 380,280 20,280" fill="rgba(0,0,0,0.18)"/>
      <polygon points="40,60 40,210 20,280 20,90" fill="rgba(0,0,0,0.20)"/>
      <polygon points="360,60 360,210 380,280 380,90" fill="rgba(0,0,0,0.20)"/>
      <!-- 地板木纹 -->
      <line x1="60" y1="228" x2="340" y2="228" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="50" y1="252" x2="350" y2="252" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
      <!-- 电视背景墙 -->
      <rect x="138" y="62" width="124" height="78" rx="4" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.4)" stroke-width="1.6"/>
      <!-- 电视 -->
      <rect x="150" y="70" width="100" height="58" rx="3" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" filter="url(#news_20260803959_shadow)"/>
      <!-- 电视屏幕光晕 -->
      <rect x="154" y="74" width="92" height="50" rx="2" fill="rgba(0,212,255,0.18)"/>
      <!-- 电视支架 -->
      <line x1="200" y1="128" x2="200" y2="134" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      <rect x="182" y="134" width="36" height="4" rx="1" fill="rgba(255,255,255,0.45)"/>
    
      <!-- 落地灯灯罩 -->
      <path d="M 64 88 L 92 88 L 86 70 L 70 70 Z" fill="rgba(255,240,200,0.55)" stroke="rgba(255,255,255,0.7)" stroke-width="1.6" filter="url(#news_20260803959_glow)"/>
      <!-- 灯杆 -->
      <line x1="78" y1="88" x2="78" y2="210" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <!-- 灯座 -->
      <ellipse cx="78" cy="212" rx="12" ry="3" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
      <!-- 灯光晕染 -->
      <circle cx="78" cy="80" r="22" fill="rgba(255,240,200,0.18)"/>
    
      <!-- 沙发主体 -->
      <rect x="120" y="178" width="160" height="38" rx="12" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.5)" stroke-width="1.6" filter="url(#news_20260803959_shadow)"/>
      <!-- 沙发靠背 -->
      <rect x="120" y="164" width="160" height="22" rx="10" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.4)" stroke-width="1.4"/>
      <!-- 沙发抱枕 -->
      <rect x="128" y="184" width="40" height="26" rx="6" fill="rgba(0,212,255,0.35)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
      <rect x="232" y="184" width="40" height="26" rx="6" fill="rgba(255,120,180,0.35)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
    
      <!-- 茶几 -->
      <rect x="170" y="200" width="60" height="10" rx="3" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" filter="url(#news_20260803959_shadow)"/>
      <rect x="174" y="210" width="6" height="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <rect x="220" y="210" width="6" height="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <!-- 茶几上的花瓶 -->
      <rect x="196" y="186" width="8" height="14" rx="2" fill="rgba(255,120,180,0.5)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <circle cx="200" cy="182" r="5" fill="rgba(0,255,128,0.55)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    
      <!-- 花盆 -->
      <path d="M 300 196 L 320 196 L 318 218 L 302 218 Z" fill="rgba(255,255,255,0.30)" stroke="rgba(255,255,255,0.5)" stroke-width="1.4"/>
      <!-- 植物叶子 -->
      <ellipse cx="310" cy="176" rx="18" ry="22" fill="rgba(0,255,128,0.45)" stroke="rgba(255,255,255,0.5)" stroke-width="1.4"/>
      <ellipse cx="298" cy="182" rx="10" ry="16" fill="rgba(0,255,128,0.40)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
      <ellipse cx="322" cy="182" rx="10" ry="16" fill="rgba(0,255,128,0.40)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
      <ellipse cx="310" cy="170" rx="9" ry="14" fill="rgba(0,255,128,0.55)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
    
      <!-- 画框 -->
      <rect x="70" y="78" width="36" height="48" rx="2" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.6)" stroke-width="1.6" filter="url(#news_20260803959_shadow)"/>
      <!-- 画内容：抽象色块 -->
      <rect x="74" y="82" width="28" height="22" fill="rgba(0,212,255,0.4)"/>
      <rect x="74" y="104" width="28" height="18" fill="rgba(255,120,180,0.4)"/>
      <circle cx="88" cy="102" r="6" fill="rgba(255,240,200,0.6)"/>
    

    <!-- 底部渐变遮罩（增强文字可读性，配合 HTML overlay） -->
    <rect y="170" width="400" height="130" fill="url(#news_20260803959_floor)"/>

    <!-- 分类标签（玻璃拟态） -->
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1" filter="url(#news_20260803959_blur)"/>
    <rect x="18" y="18" rx="14" ry="14" width="80" height="26" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="30" y="36" font-size="12" font-weight="600" fill="white" font-family="'Noto Sans SC', sans-serif">装修设计</text>
  </svg>